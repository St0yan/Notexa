name: notexa
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.1
  url_launcher: ^6.2.5
  linkify: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.3.1
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/notexa-logo.png
    - assets/notify_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/notexa-logo.png"
  addaptive_icon_foreground: "assets/notexa-logo.png"
